
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV to JSON Converter</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-50 font-sans text-gray-900">

  <main class="mx-auto max-w-3xl px-6 py-16">

    <!-- Student Information -->
    <header class="mb-12">
      <h1 class="text-lg font-semibold">
        Keanu Riel B. Ensomo
      </h1>
      <p class="mt-1 text-sm text-gray-500">
        IT 3206N Grp. 1 · MW 6:00–8:30 PM
      </p>
    </header>

    <!-- Page Title -->
    <div class="mb-10">
      <h2 class="text-3xl font-bold tracking-tight">
        CSV to JSON Converter
      </h2>
      <p class="mt-2 text-sm text-gray-500">
        Upload a CSV file to convert its contents into JSON format.
      </p>
    </div>

    <!-- Upload Section -->
    <section class="mb-8 rounded-lg border border-gray-200 bg-white p-6">

      <h3 class="mb-1 text-base font-semibold">
        1. Upload CSV
      </h3>
      <p class="mb-5 text-sm text-gray-500">
        Select a CSV file from your device.
      </p>

      <input
        type="file"
        id="csvFile"
        accept=".csv"
        class="block w-full rounded-md border border-gray-200 bg-white text-sm text-gray-600
        file:mr-4 file:cursor-pointer file:border-0
        file:border-r file:border-gray-200
        file:bg-gray-50 file:px-4 file:py-3
        file:text-sm file:font-medium file:text-gray-700
        hover:file:bg-gray-100"
      >

      <button
        id="convertBtn"
        class="mt-5 w-full cursor-pointer rounded-md bg-gray-900 px-5 py-3
        text-sm font-medium text-white transition-colors
        hover:bg-gray-700"
      >
        Convert CSV to JSON
      </button>

    </section>

    <!-- JSON Output Section -->
    <section class="rounded-lg border border-gray-200 bg-white p-6">

      <div class="mb-5 flex items-center justify-between">
        <h3 class="text-base font-semibold">
          2. JSON Display
        </h3>

        <span class="rounded bg-gray-100 px-2 py-1 text-xs text-gray-500">
          JSON
        </span>
      </div>

      <pre
        id="output"
        class="min-h-48 max-h-96 overflow-auto whitespace-pre-wrap
        break-words rounded-md border border-gray-200
        bg-gray-50 p-4 font-mono text-sm leading-6 text-gray-700"
      >Upload a CSV file and click Convert CSV to JSON.</pre>

    </section>

    <!-- Footer -->
    <footer class="mt-10 text-center text-xs text-gray-400">
      CSV to JSON Converter
    </footer>

  </main>

  <script src="server.js"></script>
</body>
</html>
